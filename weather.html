<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 앱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.6rem; margin-bottom: 20px; color: #2c3e50; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    background: white;
  }
  input[type="text"]:focus { outline: none; border-color: #667eea; }
  button {
    padding: 12px 22px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  .current {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .current .temp { font-size: 3rem; font-weight: 700; }
  .current .desc { font-size: 1.2rem; opacity: 0.9; margin-top: 5px; }
  .current .meta { font-size: 0.95rem; opacity: 0.85; margin-top: 8px; }
  .current .emoji { font-size: 4rem; }
  .current .feels { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }
  .sun-bar {
    display: flex;
    justify-content: space-around;
    background: #f7f8fc;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 25px;
    font-size: 0.9rem;
    color: #555;
  }
  .sun-bar .item { text-align: center; }
  .sun-bar .label { color: #888; font-size: 0.8rem; margin-bottom: 3px; }
  .sun-bar .value { font-weight: 600; color: #2c3e50; }
  .sun-bar .emoji { font-size: 1.2rem; }
  .section-title {
    font-size: 1.1rem;
    color: #2c3e50;
    margin: 0 0 12px 0;
    font-weight: 600;
  }
  .hourly-wrap {
    margin-bottom: 25px;
    overflow-x: auto;
    padding-bottom: 5px;
  }
  .hourly {
    display: flex;
    gap: 10px;
    min-width: max-content;
  }
  .hour {
    background: #f7f8fc;
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
    min-width: 70px;
    font-size: 0.85rem;
  }
  .hour .time { font-weight: 600; color: #2c3e50; margin-bottom: 6px; }
  .hour .emoji { font-size: 1.8rem; margin: 4px 0; }
  .hour .temp { color: #555; font-weight: 600; }
  .hour .rain { color: #3498db; font-size: 0.78rem; margin-top: 2px; }
  .forecast { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .day {
    background: #f7f8fc;
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
    font-size: 0.85rem;
  }
  .day .date { font-weight: 600; color: #2c3e50; margin-bottom: 6px; }
  .day .emoji { font-size: 1.8rem; margin: 4px 0; }
  .day .temps { color: #555; }
  .day .high { color: #e74c3c; font-weight: 600; }
  .day .low { color: #3498db; font-weight: 600; }
  .loading { text-align: center; padding: 40px; color: #888; }
  .error { color: #e74c3c; padding: 15px; background: #fdeaea; border-radius: 10px; }
  .map-section { margin-bottom: 25px; }
  .map-section .section-title { display: flex; align-items: center; justify-content: space-between; }
  .map-tabs {
    display: flex;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .map-tab {
    padding: 4px 12px;
    border-radius: 20px;
    background: #f0f1f6;
    color: #666;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }
  .map-tab.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
  }
  .map-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  #map { height: 420px; width: 100%; }
  .map-info {
    position: absolute;
    bottom: 8px;
    left: 8px;
    z-index: 1000;
    background: rgba(255,255,255,0.92);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    color: #555;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .map-info .time-label { font-weight: 600; color: #2c3e50; }
  .map-timestamp-slider {
    position: absolute;
    bottom: 8px;
    right: 8px;
    z-index: 1000;
    background: rgba(255,255,255,0.92);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    color: #555;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .leaflet-container { background: #aadaff; }
  @media (max-width: 600px) {
    .forecast { grid-template-columns: repeat(4, 1fr); }
    #map { height: 320px; }
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div class="container">
  <h1>날씨 예보</h1>
  <div class="controls">
    <input type="text" id="city" placeholder="도시명 입력 (예: 청주, 서울, 부산)" value="청주">
    <button id="btn">검색</button>
  </div>
  <div id="content"><div class="loading">불러오는 중...</div></div>
  <div class="map-section">
    <div class="section-title">
      <span>위성/레이더 영상</span>
      <div class="map-tabs">
        <button class="map-tab active" data-layer="radar">레이더</button>
        <button class="map-tab" data-layer="satellite">위성(IR)</button>
        <button class="map-tab" data-layer="cover">구름</button>
      </div>
    </div>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-info"><span class="time-label" id="map-time">--:--</span> · 영상 시각</div>
      <div class="map-timestamp-slider">
        <button id="map-prev" title="이전">◀</button>
        <input type="range" id="map-slider" min="0" max="0" value="0" style="width:140px;">
        <button id="map-play" title="재생">▶</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WMO = {
  0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["부분적 흐림", "⛅"], 3: ["흐림", "☁️"],
  45: ["안개", "🌫️"], 48: ["결빙 안개", "🌫️"],
  51: ["약한 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌦️"],
  61: ["약한 비", "🌧️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
  71: ["약한 눈", "🌨️"], 73: ["눈", "❄️"], 75: ["강한 눈", "❄️"],
  80: ["약한 소나기", "🌦️"], 81: ["소나기", "🌦️"], 82: ["강한 소나기", "🌦️"],
  95: ["천둥번개", "⛈️"], 96: ["천둥번개+우박", "⛈️"], 99: ["심한 천둥번개+우박", "⛈️"],
};

// 한국어 도시명 -> 영문 매핑 (Geocoding API가 한국어를 잘 못 찾을 때 대비)
const CITY_MAP = {
  "서울": "Seoul", "부산": "Busan", "대구": "Daegu", "인천": "Incheon",
  "광주": "Gwangju", "대전": "Daejeon", "울산": "Ulsan", "수원": "Suwon",
  "제주": "Jeju", "청주": "Cheongju", "전주": "Jeonju",
};

async function getCoords(city) {
  const q = CITY_MAP[city] || city;
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=ko`;
  const r = await fetch(url);
  const data = await r.json();
  if (!data.results) return null;
  return data.results[0];
}

async function getWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation` +
    `&hourly=weather_code,temperature_2m,precipitation_probability` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max` +
    `&timezone=Asia/Seoul&forecast_days=7`;
  const r = await fetch(url);
  return r.json();
}

function formatDate(s) {
  const d = new Date(s);
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${d.getMonth()+1}/${d.getDate()} ${days[d.getDay()]}`;
}

function formatHour(iso) {
  const d = new Date(iso);
  const h = d.getHours();
  return (h === 0 ? "0시" : `${h}시`);
}

async function load() {
  const city = document.getElementById("city").value.trim();
  if (!city) return;
  const content = document.getElementById("content");
  content.innerHTML = '<div class="loading">불러오는 중...</div>';

  try {
    const c = await getCoords(city);
    if (!c) { content.innerHTML = '<div class="error">도시를 찾을 수 없습니다.</div>'; return; }
    const w = await getWeather(c.latitude, c.longitude);
    const cur = w.current;
    const [cdesc, cemoji] = WMO[cur.weather_code] || ["알 수 없음", "❓"];

    // 현재 날씨
    let html = `
      <div class="current">
        <div>
          <div class="desc">${c.name} · ${cdesc}</div>
          <div class="temp">${cur.temperature_2m}°C</div>
          <div class="feels">체감 ${cur.apparent_temperature}°C · 강수 ${cur.precipitation ?? 0} mm</div>
          <div class="meta">습도 ${cur.relative_humidity_2m}% · 풍속 ${cur.wind_speed_10m} km/h</div>
        </div>
        <div class="emoji">${cemoji}</div>
      </div>`;

    // 일출/일몰
    const sr = w.daily.sunrise[0];
    const ss = w.daily.sunset[0];
    html += `
      <div class="sun-bar">
        <div class="item"><div class="emoji">🌅</div><div class="label">일출</div><div class="value">${sr.slice(11,16)}</div></div>
        <div class="item"><div class="emoji">🌇</div><div class="label">일몰</div><div class="value">${ss.slice(11,16)}</div></div>
        <div class="item"><div class="emoji">💧</div><div class="label">오늘 강수확률</div><div class="value">${w.daily.precipitation_probability_max?.[0] ?? 0}%</div></div>
      </div>`;

    // 24시간 예보 (현재 시간부터 24시간)
    html += `<div class="hourly-wrap"><div class="section-title">24시간 예보</div><div class="hourly">`;
    const nowIdx = w.hourly.time.findIndex(t => new Date(t) >= new Date(cur.time));
    const startIdx = nowIdx > 0 ? nowIdx : 0;
    const endIdx = Math.min(startIdx + 24, w.hourly.time.length);
    for (let i = startIdx; i < endIdx; i++) {
      const [desc, emoji] = WMO[w.hourly.weather_code[i]] || ["알 수 없음", "❓"];
      const temp = w.hourly.temperature_2m[i];
      const rain = w.hourly.precipitation_probability ? w.hourly.precipitation_probability[i] : null;
      html += `
        <div class="hour">
          <div class="time">${formatHour(w.hourly.time[i])}</div>
          <div class="emoji">${emoji}</div>
          <div class="temp">${temp}°</div>
          ${rain != null ? `<div class="rain">${rain}%</div>` : ""}
        </div>`;
    }
    html += `</div></div>`;

    // 일주일(7일) 예보
    html += `<div class="section-title">일주일 예보</div><div class="forecast">`;
    w.daily.time.forEach((t, i) => {
      const [desc, emoji] = WMO[w.daily.weather_code[i]] || ["알 수 없음", "❓"];
      const rain = w.daily.precipitation_probability_max?.[i] ?? 0;
      html += `
        <div class="day">
          <div class="date">${formatDate(t)}</div>
          <div class="emoji">${emoji}</div>
          <div class="desc">${desc}</div>
          <div class="temps">
            <span class="high">${w.daily.temperature_2m_max[i]}°</span>
            <span class="low">${w.daily.temperature_2m_min[i]}°</span>
          </div>
          <div class="rain">${rain}%</div>
        </div>`;
    });
    html += "</div>";
    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = '<div class="error">오류: ' + e.message + '</div>';
  }
}

document.getElementById("btn").addEventListener("click", load);
document.getElementById("city").addEventListener("keydown", e => {
  if (e.key === "Enter") load();
});
load();

/* ===== Leaflet + RainViewer 위성/레이더 지도 ===== */
let map = null, radarLayer = null, satLayer = null, cloudLayer = null;
let rvData = null;       // RainViewer past雷达/위성 타임스탬프
let rvDataCov = null;    // RainViewer sat coverage (구름)
let currentLayerType = "radar";
let currentFrameIdx = 0;
let playTimer = null;

function initMap() {
  if (map) return;
  map = L.map("map", { zoomControl: true, attributionControl: true }).setView([36.5, 127.8], 6);
  // OpenStreetMap base
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "© OpenStreetMap"
  }).addTo(map);

  // 탭 전환
  document.querySelectorAll(".map-tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".map-tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      currentLayerType = t.dataset.layer;
      applyLayer();
    });
  });
  // 슬라이더 / 버튼
  document.getElementById("map-slider").addEventListener("input", e => {
    currentFrameIdx = parseInt(e.target.value, 10);
    applyLayer();
  });
  document.getElementById("map-prev").addEventListener("click", () => {
    if (!rvData) return;
    currentFrameIdx = Math.max(0, currentFrameIdx - 1);
    document.getElementById("map-slider").value = currentFrameIdx;
    applyLayer();
  });
  document.getElementById("map-play").addEventListener("click", togglePlay);

  fetchRainViewer();
}

async function fetchRainViewer() {
  try {
    const r = await fetch("https://api.rainviewer.com/public/weather-maps.json");
    const data = await r.json();
    rvData = data.radar && data.radar.past ? data.radar.past.concat(data.radar.nowsat || []) : [];
    if (rvData.length === 0) {
      document.getElementById("map-time").textContent = "데이터 없음";
      return;
    }
    rvDataCov = data.satellite && data.satellite.infrared ? data.satellite.infrared : [];
    currentFrameIdx = rvData.length - 1;
    const slider = document.getElementById("map-slider");
    slider.max = rvData.length - 1;
    slider.value = currentFrameIdx;
    applyLayer();
  } catch (e) {
    document.getElementById("map-time").textContent = "로드 실패";
  }
}

function applyLayer() {
  if (!rvData || rvData.length === 0) return;
  const idx = Math.min(currentFrameIdx, rvData.length - 1);
  const frame = rvData[idx];
  const host = "https://tilecache.rainviewer.com";
  const radarPath = `${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
  // satellite IR: 같은 host + satellite 경로 (nowsat에 path가 있을 수 있음)
  const satPath = `${host}${frame.path}/256/{z}/{x}/{y}/2/0_0.png`;

  if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
  if (satLayer) { map.removeLayer(satLayer); satLayer = null; }
  if (cloudLayer) { map.removeLayer(cloudLayer); cloudLayer = null; }

  if (currentLayerType === "radar") {
    radarLayer = L.tileLayer(radarPath, {
      opacity: 0.75, zIndex: 200
    }).addTo(map);
  } else if (currentLayerType === "satellite") {
    satLayer = L.tileLayer(satPath, {
      opacity: 0.85, zIndex: 200
    }).addTo(map);
  } else if (currentLayerType === "cover") {
    // sat coverage: 별도 배열
    if (rvDataCov && rvDataCov.length > 0) {
      const covFrame = rvDataCov[rvDataCov.length - 1];
      const covPath = `${host}${covFrame.path}/256/{z}/{x}/{y}/2/0_0.png`;
      cloudLayer = L.tileLayer(covPath, {
        opacity: 0.8, zIndex: 200
      }).addTo(map);
    }
  }

  const t = new Date(frame.time * 1000);
  const hh = String(t.getHours()).padStart(2, "0");
  const mm = String(t.getMinutes()).padStart(2, "0");
  document.getElementById("map-time").textContent = `${hh}:${mm}`;
  document.getElementById("map-slider").value = idx;
}

function togglePlay() {
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
    document.getElementById("map-play").textContent = "▶";
  } else {
    document.getElementById("map-play").textContent = "⏸";
    playTimer = setInterval(() => {
      if (!rvData) return;
      currentFrameIdx = (currentFrameIdx + 1) % rvData.length;
      applyLayer();
    }, 700);
  }
}

initMap();
</script>
</body>
</html>
