<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 앱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  @media (max-width: 600px) {
    body { padding: 10px; }
    .container { padding: 18px 14px; border-radius: 14px; }
    h1 { font-size: 1.35rem; margin-bottom: 14px; }
    .current { padding: 18px; }
    .current .temp { font-size: 2.4rem; }
    .current .emoji { font-size: 3rem; }
    .controls { gap: 8px; margin-bottom: 18px; }
    input[type="text"], button { padding: 10px 12px; font-size: 0.95rem; }
  }
  h1 { font-size: 1.6rem; margin-bottom: 20px; color: #2c3e50; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    background: white;
  }
  input[type="text"]:focus { outline: none; border-color: #667eea; }
  button {
    padding: 12px 22px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  .current {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .current .temp { font-size: 3rem; font-weight: 700; }
  .current .desc { font-size: 1.2rem; opacity: 0.9; margin-top: 5px; }
  .current .meta { font-size: 0.95rem; opacity: 0.85; margin-top: 8px; }
  .current .emoji { font-size: 4rem; }
  .current .feels { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }
  .sun-bar {
    display: flex;
    justify-content: space-around;
    background: #f7f8fc;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 25px;
    font-size: 0.9rem;
    color: #555;
  }
  .sun-bar .item { text-align: center; }
  .sun-bar .label { color: #888; font-size: 0.8rem; margin-bottom: 3px; }
  .sun-bar .value { font-weight: 600; color: #2c3e50; }
  .sun-bar .emoji { font-size: 1.2rem; }
  .section-title {
    font-size: 1.1rem;
    color: #2c3e50;
    margin: 0 0 12px 0;
    font-weight: 600;
  }
  .hourly-wrap {
    margin-bottom: 25px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 5px;
    -webkit-overflow-scrolling: touch;
  }
  .hourly {
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    width: max-content;
  }
  .hour {
    background: #f7f8fc;
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
    min-width: 70px;
    flex: 0 0 70px;
    font-size: 0.85rem;
  }
  .hour .time { font-weight: 600; color: #2c3e50; margin-bottom: 6px; }
  .hour .emoji { font-size: 1.8rem; margin: 4px 0; }
  .hour .temp { color: #555; font-weight: 600; }
  .hour .rain { color: #3498db; font-size: 0.78rem; margin-top: 2px; }
  .hour .hum { color: #16a34a; font-size: 0.78rem; margin-top: 1px; }
  .hour .wind { color: #64748b; font-size: 0.74rem; margin-top: 1px; }
  .forecast-wrap {
    margin-bottom: 25px;
  }
  .forecast {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .day {
    background: #f7f8fc;
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
    font-size: 0.85rem;
    flex: 1 1 0;            /* 7일 컨테이너 폭을 균등 분할 */
    min-width: 0;           /* flex 축소 허용 */
  }
  @media (max-width: 600px) {
    .forecast { width: 100%; }
    .day { flex: 1 1 0; min-width: 0; }  /* 모바일: 7일 화면 폭 균등 분할 */
  }
  .day .date { font-weight: 600; color: #2c3e50; margin-bottom: 6px; }
  .day .emoji { font-size: 1.8rem; margin: 4px 0; }
  .day .temps { color: #555; }
  .day .high { color: #e74c3c; font-weight: 600; }
  .day .low { color: #3498db; font-weight: 600; }
  .loading { text-align: center; padding: 40px; color: #888; }
  .error { color: #e74c3c; padding: 15px; background: #fdeaea; border-radius: 10px; }
  .chart-section { margin-bottom: 25px; }
  .chart-section .section-title { display: flex; align-items: center; justify-content: space-between; }
  .chart-legend {
    display: flex;
    gap: 12px;
    font-size: 0.78rem;
    color: #666;
  }
  .chart-legend .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  #rainChart { display:block; width: 100%; height: 180px; background: #f7f8fc; border-radius: 12px; }
  @media (max-width: 600px) { #rainChart { height: 140px; } }
  .map-section { margin-bottom: 25px; }
  .aqi-section { margin-bottom: 25px; }
  .aqi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .aqi-card {
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    color: white;
  }
  .aqi-card .label { font-size: 0.8rem; opacity: 0.9; }
  .aqi-card .value { font-size: 1.6rem; font-weight: 700; margin: 4px 0; }
  .aqi-card .unit { font-size: 0.75rem; opacity: 0.85; }
  .aqi-card .grade { font-size: 0.82rem; font-weight: 600; margin-top: 4px; }
  .aqi-empty {
    background: #f7f8fc;
    color: #888;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    font-size: 0.88rem;
  }
  .map-section .section-title { display: flex; align-items: center; justify-content: space-between; }
  .map-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  #map { height: 420px; width: 100%; }
  .map-info {
    position: absolute;
    bottom: 8px;
    left: 8px;
    z-index: 1000;
    background: rgba(255,255,255,0.92);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    color: #555;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .map-info .time-label { font-weight: 600; color: #2c3e50; }
  .map-timestamp-slider {
    position: absolute;
    bottom: 8px;
    right: 8px;
    z-index: 1000;
    background: rgba(255,255,255,0.92);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    color: #555;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .leaflet-container { background: #aadaff; }
  @media (max-width: 600px) {
    #map { height: 320px; }
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div class="container">
  <h1>날씨 예보</h1>
  <div class="controls">
    <input type="text" id="city" placeholder="도시명 입력 (예: 청주, 서울, 부산)" value="청주">
    <button id="btn">검색</button>
  </div>
  <div id="content"><div class="loading">불러오는 중...</div></div>
  <div class="map-section">
    <div class="section-title">
      <span>레이더 영상</span>
    </div>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-info"><span class="time-label" id="map-time">--:--</span> · 영상 시각</div>
      <div class="map-timestamp-slider">
        <button id="map-prev" title="이전">◀</button>
        <input type="range" id="map-slider" min="0" max="0" value="0" style="width:140px;">
        <button id="map-play" title="재생">▶</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WMO = {
  0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["부분적 흐림", "⛅"], 3: ["흐림", "☁️"],
  45: ["안개", "🌫️"], 48: ["결빙 안개", "🌫️"],
  51: ["약한 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌦️"],
  61: ["약한 비", "🌧️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
  71: ["약한 눈", "🌨️"], 73: ["눈", "❄️"], 75: ["강한 눈", "❄️"],
  80: ["약한 소나기", "🌦️"], 81: ["소나기", "🌦️"], 82: ["강한 소나기", "🌦️"],
  95: ["천둥번개", "⛈️"], 96: ["천둥번개+우박", "⛈️"], 99: ["심한 천둥번개+우박", "⛈️"],
};

// 한국어 도시명 -> 영문 매핑 (Geocoding API가 한국어를 잘 못 찾을 때 대비)
const CITY_MAP = {
  "서울": "Seoul", "부산": "Busan", "대구": "Daegu", "인천": "Incheon",
  "광주": "Gwangju", "대전": "Daejeon", "울산": "Ulsan", "수원": "Suwon",
  "제주": "Jeju", "청주": "Cheongju", "전주": "Jeonju",
};

async function getCoords(city) {
  const q = CITY_MAP[city] || city;
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=ko`;
  const r = await fetch(url);
  const data = await r.json();
  if (!data.results) return null;
  return data.results[0];
}

async function getWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,precipitation` +
    `&hourly=weather_code,temperature_2m,relative_humidity_2m,precipitation_probability,wind_direction_10m` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max` +
    `&timezone=Asia/Seoul&forecast_days=11`;
  const r = await fetch(url);
  return r.json();
}

// 미세먼지 (Open-Meteo Air Quality API, 키 불필요)
async function getAirQuality(lat, lon) {
  const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}` +
    `&current=pm10,pm2_5,us_aqi&timezone=Asia/Seoul`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

// 한국 환경부 기준 등급 (농도 μg/m³)
function pmGrade(pm, type) {
  // type: "pm10" or "pm25"
  if (type === "pm10") {
    if (pm <= 30) return ["좋음", "#1a9e3f"];
    if (pm <= 80) return ["보통", "#f7b500"];
    if (pm <= 150) return ["나쁨", "#e64725"];
    return ["매우 나쁨", "#7a1b6f"];
  } else {
    if (pm <= 15) return ["좋음", "#1a9e3f"];
    if (pm <= 35) return ["보통", "#f7b500"];
    if (pm <= 75) return ["나쁨", "#e64725"];
    return ["매우 나쁨", "#7a1b6f"];
  }
}

function usAqiGrade(aqi) {
  if (aqi <= 50) return ["좋음", "#1a9e3f"];
  if (aqi <= 100) return ["보통", "#f7b500"];
  if (aqi <= 150) return ["민감군 위해", "#f97a16"];
  if (aqi <= 200) return ["나쁨", "#e64725"];
  if (aqi <= 300) return ["매우 나쁨", "#7a1b6f"];
  return ["위험", "#7a1b6f"];
}

function formatDate(s) {
  const d = new Date(s);
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${d.getMonth()+1}/${d.getDate()} ${days[d.getDay()]}`;
}

function formatHour(iso) {
  const d = new Date(iso);
  const h = d.getHours();
  return (h === 0 ? "0시" : `${h}시`);
}

// 풍향(각도) → 한글 8방위 + 화살표 (바람이 불어오는 방향 기준)
function windDir(deg) {
  if (deg == null) return "";
  const dirs = ["북", "북동", "동", "남동", "남", "남서", "서", "북서"];
  return dirs[Math.round(deg / 45) % 8];
}
function windArrow(deg) {
  if (deg == null) return "";
  // 바람이 불러가는 방향(불어오는 반대) 화살표
  const arrows = ["↓", "↙", "←", "↖", "↑", "↗", "→", "↘"];
  return arrows[Math.round(deg / 45) % 8];
}

async function load() {
  const city = document.getElementById("city").value.trim();
  if (!city) return;
  const content = document.getElementById("content");
  content.innerHTML = '<div class="loading">불러오는 중...</div>';

  try {
    const c = await getCoords(city);
    if (!c) { content.innerHTML = '<div class="error">도시를 찾을 수 없습니다.</div>'; return; }
    const [w, aq] = await Promise.all([
      getWeather(c.latitude, c.longitude),
      getAirQuality(c.latitude, c.longitude)
    ]);
    const cur = w.current;
    const [cdesc, cemoji] = WMO[cur.weather_code] || ["알 수 없음", "❓"];

    // 현재 날씨
    let html = `
      <div class="current">
        <div>
          <div class="desc">${c.name} · ${cdesc}</div>
          <div class="temp">${cur.temperature_2m}°C</div>
          <div class="feels">체감 ${cur.apparent_temperature}°C · 강수 ${cur.precipitation ?? 0} mm</div>
          <div class="meta">습도 ${cur.relative_humidity_2m}% · 풍속 ${cur.wind_speed_10m} km/h · 풍향 ${windArrow(cur.wind_direction_10m)} ${windDir(cur.wind_direction_10m)} (${cur.wind_direction_10m}°)</div>
        </div>
        <div class="emoji">${cemoji}</div>
      </div>`;

    // 일출/일몰
    const sr = w.daily.sunrise[0];
    const ss = w.daily.sunset[0];
    html += `
      <div class="sun-bar">
        <div class="item"><div class="emoji">🌅</div><div class="label">일출</div><div class="value">${sr.slice(11,16)}</div></div>
        <div class="item"><div class="emoji">🌇</div><div class="label">일몰</div><div class="value">${ss.slice(11,16)}</div></div>
        <div class="item"><div class="emoji">💧</div><div class="label">오늘 강수확률</div><div class="value">${w.daily.precipitation_probability_max?.[0] ?? 0}%</div></div>
      </div>`;

    // 미세먼지
    if (aq && aq.current) {
      const pm10 = aq.current.pm10, pm25 = aq.current.pm2_5, usAqi = aq.current.us_aqi;
      const [g10, c10] = pm10 != null ? pmGrade(pm10, "pm10") : ["-", "#999"];
      const [g25, c25] = pm25 != null ? pmGrade(pm25, "pm25") : ["-", "#999"];
      const [gAqi, cAqi] = usAqi != null ? usAqiGrade(usAqi) : ["-", "#999"];
      html += `
        <div class="aqi-section">
          <div class="section-title">대기질 정보</div>
          <div class="aqi-grid">
            <div class="aqi-card" style="background:${c10}">
              <div class="label">미세먼지 (PM10)</div>
              <div class="value">${pm10 != null ? pm10 : "-"}</div>
              <div class="unit">μg/m³</div>
              <div class="grade">${g10}</div>
            </div>
            <div class="aqi-card" style="background:${c25}">
              <div class="label">초미세먼지 (PM2.5)</div>
              <div class="value">${pm25 != null ? pm25 : "-"}</div>
              <div class="unit">μg/m³</div>
              <div class="grade">${g25}</div>
            </div>
            <div class="aqi-card" style="background:${cAqi}">
              <div class="label">통합 대기지수 (US AQI)</div>
              <div class="value">${usAqi != null ? usAqi : "-"}</div>
              <div class="unit">AQI</div>
              <div class="grade">${gAqi}</div>
            </div>
          </div>
        </div>`;
    } else {
      html += `<div class="aqi-section"><div class="section-title">대기질 정보</div><div class="aqi-empty">대기질 정보를 불러올 수 없습니다.</div></div>`;
    }

    // 24시간 예보 (현재 시간부터 24시간)
    html += `<div class="hourly-wrap"><div class="section-title">24시간 예보</div><div class="hourly">`;
    const nowIdx = w.hourly.time.findIndex(t => new Date(t) >= new Date(cur.time));
    const startIdx = nowIdx > 0 ? nowIdx : 0;
    const endIdx = Math.min(startIdx + 24, w.hourly.time.length);
    for (let i = startIdx; i < endIdx; i++) {
      const [desc, emoji] = WMO[w.hourly.weather_code[i]] || ["알 수 없음", "❓"];
      const temp = w.hourly.temperature_2m[i];
      const rain = w.hourly.precipitation_probability ? w.hourly.precipitation_probability[i] : null;
      const hum = w.hourly.relative_humidity_2m ? w.hourly.relative_humidity_2m[i] : null;
      const wd = w.hourly.wind_direction_10m ? w.hourly.wind_direction_10m[i] : null;
      html += `
        <div class="hour">
          <div class="time">${formatHour(w.hourly.time[i])}</div>
          <div class="emoji">${emoji}</div>
          <div class="temp">${temp}°</div>
          ${rain != null ? `<div class="rain">${rain}%</div>` : ""}
          ${hum != null ? `<div class="hum">💧${hum}%</div>` : ""}
          ${wd != null ? `<div class="wind">${windArrow(wd)} ${windDir(wd)}</div>` : ""}
        </div>`;
    }
    html += `</div></div>`;

    // 강수/기온/습도 예측 그래프 (24시간)
    const chartHours = [], chartTemp = [], chartRain = [], chartHum = [];
    for (let i = startIdx; i < endIdx; i++) {
      chartHours.push(w.hourly.time[i]);
      chartTemp.push(w.hourly.temperature_2m[i]);
      chartRain.push(w.hourly.precipitation_probability ? w.hourly.precipitation_probability[i] : 0);
      chartHum.push(w.hourly.relative_humidity_2m ? w.hourly.relative_humidity_2m[i] : 0);
    }
    html += `
      <div class="chart-section">
        <div class="section-title">
          <span>강수/기온/습도 예측 (24시간)</span>
          <div class="chart-legend">
            <span><span class="dot" style="background:#e74c3c"></span>기온(°C)</span>
            <span><span class="dot" style="background:#3498db"></span>강수확률(%)</span>
            <span><span class="dot" style="background:#16a34a"></span>습도(%)</span>
          </div>
        </div>
        <canvas id="rainChart"></canvas>
      </div>`;

    // 10일 예보 (내일부터, 오늘 제외)
    html += `<div class="section-title">10일 예보 (내일부터)</div><div class="forecast-wrap"><div class="forecast">`;
    for (let i = 1; i <= 10 && i < w.daily.time.length; i++) {
      const t = w.daily.time[i];
      const [desc, emoji] = WMO[w.daily.weather_code[i]] || ["알 수 없음", "❓"];
      const rain = w.daily.precipitation_probability_max?.[i] ?? 0;
      html += `
        <div class="day">
          <div class="date">${formatDate(t)}</div>
          <div class="emoji">${emoji}</div>
          <div class="desc">${desc}</div>
          <div class="temps">
            <span class="high">${w.daily.temperature_2m_max[i]}°</span>
            <span class="low">${w.daily.temperature_2m_min[i]}°</span>
          </div>
          <div class="rain">${rain}%</div>
        </div>`;
    }
    html += "</div></div>";
    content.innerHTML = html;
    drawRainChart(chartHours, chartTemp, chartRain, chartHum);
  } catch (e) {
    content.innerHTML = '<div class="error">오류: ' + e.message + '</div>';
  }
}

document.getElementById("btn").addEventListener("click", load);
document.getElementById("city").addEventListener("keydown", e => {
  if (e.key === "Enter") load();
});
load();

/* ===== 강수/기온/습도 예측 그래프 (Canvas) ===== */
// 차트 폭/높이/폰트/패딩 비례 스케일링 (모바일 대응)
let _lastChartData = null;  // resize 시 재렌더링용 데이터 캐시
function drawRainChart(times, temps, rains, hums) {
  const canvas = document.getElementById("rainChart");
  if (!canvas) return;
  _lastChartData = { times, temps, rains, hums };  // 캐시 저장
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  // 폭에 비례한 스케일 팩터 (기준 800px, 0.6~1.2 범위)
  const sc = Math.max(0.6, Math.min(1.2, cssW / 800));
  const FONT = Math.max(8, Math.round(10 * sc));  // 축 라벨 폰트
  const padL = Math.max(32, Math.round(40 * sc));  // 기온 Y축(좌측) — "−10°" 긴 라벨 여유
  const padR = Math.max(28, Math.round(34 * sc));  // 확률 Y축(우측) — "100%" 여유
  const padT = Math.max(10, Math.round(12 * sc));
  const padB = Math.max(18, Math.round(22 * sc));
  const w = cssW - padL - padR;
  const h = cssH - padT - padB;
  const n = times.length;
  if (n === 0) return;

  const tMin = Math.min(...temps), tMax = Math.max(...temps);
  const tPad = Math.max(2, (tMax - tMin) * 0.15);
  const yTmin = Math.floor(tMin - tPad), yTmax = Math.ceil(tMax + tPad);
  const yRmin = 0, yRmax = 100;

  const x = i => padL + (n === 1 ? w/2 : (i / (n - 1)) * w);
  const yT = v => padT + h - ((v - yTmin) / (yTmax - yTmin || 1)) * h;
  const yR = v => padT + h - ((v - yRmin) / (yRmax - yRmin)) * h;

  // 그리드 + Y축 라벨 (기온 좌, 강수확률/습도 우)
  ctx.font = FONT + "px sans-serif";
  ctx.fillStyle = "#888";
  ctx.textBaseline = "middle";
  for (let p = 0; p <= 4; p++) {
    const yy = padT + (p / 4) * h;
    ctx.strokeStyle = "#e6e8ef";
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL + w, yy); ctx.stroke();
    const rv = Math.round(yRmax - (p / 4) * (yRmax - yRmin));
    const tv = (yTmax - (p / 4) * (yTmax - yTmin)).toFixed(0);
    // 좌측: 기온 (빨강) — 우측 정렬
    ctx.fillStyle = "#e74c3c";
    ctx.textAlign = "right";
    ctx.fillText(tv + "°", padL - 4, yy);
    // 우측: 확률 (파랑) — 좌측 정렬
    ctx.fillStyle = "#3498db";
    ctx.textAlign = "left";
    ctx.fillText(rv + "%", padL + w + 4, yy);
  }
  ctx.textAlign = "left";

  // 강수확률 영역 채우기
  const grad = ctx.createLinearGradient(0, padT, 0, padT + h);
  grad.addColorStop(0, "rgba(52, 152, 219, 0.45)");
  grad.addColorStop(1, "rgba(52, 152, 219, 0.05)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(x(0), padT + h);
  for (let i = 0; i < n; i++) ctx.lineTo(x(i), yR(rains[i]));
  ctx.lineTo(x(n - 1), padT + h);
  ctx.closePath();
  ctx.fill();
  // 강수확률 선
  ctx.strokeStyle = "#3498db";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    if (i === 0) ctx.moveTo(x(i), yR(rains[i]));
    else ctx.lineTo(x(i), yR(rains[i]));
  }
  ctx.stroke();

  // 습도 선 (강수확률과 같은 0~100% 축 사용)
  if (hums && hums.length === n) {
    ctx.strokeStyle = "#16a34a";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      if (i === 0) ctx.moveTo(x(i), yR(hums[i]));
      else ctx.lineTo(x(i), yR(hums[i]));
    }
    ctx.stroke();
    ctx.setLineDash([]);
    // 습도 점
    ctx.fillStyle = "#16a34a";
    const dotR = Math.max(1.2, 1.4 * sc);
    for (let i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.arc(x(i), yR(hums[i]), dotR, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 기온 선
  ctx.strokeStyle = "#e74c3c";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    if (i === 0) ctx.moveTo(x(i), yT(temps[i]));
    else ctx.lineTo(x(i), yT(temps[i]));
  }
  ctx.stroke();
  // 기온 점
  ctx.fillStyle = "#e74c3c";
  const tDotR = Math.max(1.4, 1.6 * sc);
  for (let i = 0; i < n; i++) {
    ctx.beginPath();
    ctx.arc(x(i), yT(temps[i]), tDotR, 0, Math.PI * 2);
    ctx.fill();
  }

  // X축 라벨 — 폭이 좁으면 6시간 간격, 넓으면 3시간 간격
  ctx.fillStyle = "#888";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  const xStep = (cssW < 500) ? 6 : 3;  // 모바일 6시간, 데스크톱 3시간
  for (let i = 0; i < n; i++) {
    const d = new Date(times[i]);
    if (d.getHours() % xStep === 0) {
      const label = (d.getHours() === 0 ? "0시" : d.getHours() + "시");
      ctx.fillText(label, x(i), padT + h + 4);
    }
  }
}

// resize 디바운스 — 차트 재렌더링 (데이터 재사용, API 호출 없음)
let _rzT = null;
window.addEventListener("resize", () => {
  if (!_lastChartData) return;
  if (_rzT) clearTimeout(_rzT);
  _rzT = setTimeout(() => drawRainChart(_lastChartData.times, _lastChartData.temps, _lastChartData.rains, _lastChartData.hums), 120);
});

/* ===== Leaflet + RainViewer 위성/레이더 지도 ===== */
let map = null, radarLayer = null;
let rvData = null;       // RainViewer radar.past
let rvHost = "https://tilecache.rainviewer.com";
let currentFrameIdx = 0;
let playTimer = null;

function initMap() {
  if (map) return;
  map = L.map("map", { zoomControl: true, attributionControl: true }).setView([36.5, 127.8], 6);
  // OpenStreetMap base
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "© OpenStreetMap"
  }).addTo(map);

  // 슬라이더 / 버튼
  document.getElementById("map-slider").addEventListener("input", e => {
    currentFrameIdx = parseInt(e.target.value, 10);
    applyLayer();
  });
  document.getElementById("map-prev").addEventListener("click", () => {
    if (!rvData) return;
    currentFrameIdx = Math.max(0, currentFrameIdx - 1);
    document.getElementById("map-slider").value = currentFrameIdx;
    applyLayer();
  });
  document.getElementById("map-play").addEventListener("click", togglePlay);

  fetchRainViewer();
}

async function fetchRainViewer() {
  try {
    const r = await fetch("https://api.rainviewer.com/public/weather-maps.json");
    const data = await r.json();
    if (data.host) rvHost = data.host;
    rvData = (data.radar && data.radar.past) ? data.radar.past.slice() : [];
    if (data.radar && data.radar.nowcast) rvData = rvData.concat(data.radar.nowcast);
    if (rvData.length === 0) {
      document.getElementById("map-time").textContent = "데이터 없음";
      return;
    }
    currentFrameIdx = rvData.length - 1;
    const slider = document.getElementById("map-slider");
    slider.max = rvData.length - 1;
    slider.value = currentFrameIdx;
    applyLayer();
  } catch (e) {
    document.getElementById("map-time").textContent = "로드 실패";
  }
}

function applyLayer() {
  if (!map) return;
  if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }

  const frames = rvData;
  if (!frames || frames.length === 0) {
    document.getElementById("map-time").textContent = "레이더 데이터 없음";
    return;
  }
  const idx = Math.min(currentFrameIdx, frames.length - 1);
  const frame = frames[idx];
  // color/scheme: radar=1_1 (reflectivity, past=2)
  const scheme = "1_1";
  const size = 256;
  const tileUrl = `${rvHost}${frame.path}/${size}/{z}/{x}/{y}/2/${scheme}.png`;
  radarLayer = L.tileLayer(tileUrl, { opacity: 0.75, zIndex: 200 }).addTo(map);

  const t = new Date(frame.time * 1000);
  const hh = String(t.getHours()).padStart(2, "0");
  const mm = String(t.getMinutes()).padStart(2, "0");
  document.getElementById("map-time").textContent = `${hh}:${mm}`;
  document.getElementById("map-slider").value = idx;
}

function togglePlay() {
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
    document.getElementById("map-play").textContent = "▶";
  } else {
    document.getElementById("map-play").textContent = "⏸";
    playTimer = setInterval(() => {
      const frames = rvData;
      if (!frames || frames.length === 0) return;
      currentFrameIdx = (currentFrameIdx + 1) % frames.length;
      applyLayer();
    }, 700);
  }
}

initMap();
</script>
